<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CTL Participation Search</title>
<link rel="icon" type="image/png" href="ctl-favicon.PNG">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="inner">

      <img
        class="logo"
        src="ctl-logo.PNG"
        alt="Center for Teaching and Learning, Lackawanna College"
      >

      <div class="title">
        Participation Search
      </div>

      <div
        id="updatedDate"
        class="updated-date"
      >
        Data updated: —
      </div>

      <div class="admin-auth">
        <span
          id="adminIdentity"
          class="admin-identity"
          style="display: none;"
        ></span>

        <button
          id="adminSignInBtn"
          type="button"
          class="admin-link"
        >
          Admin Sign In
        </button>

        <button
          id="adminSignOutBtn"
          type="button"
          class="admin-link"
          style="display: none;"
        >
          Sign Out
        </button>
      </div>

    </div>
  </header>

  
  
  <!-- ADMIN WORKSPACE -->
<section id="adminWorkspace" class="admin-workspace" style="display: none;">
  <div class="admin-workspace-inner">
    <strong>Admin Tools</strong>
  </div>
</section>
  <dialog id="adminLoginDialog" class="admin-login-dialog">
    <form id="adminLoginForm" method="dialog">
      <div class="admin-login-heading">
        Admin Sign In
      </div>

      <div class="admin-login-field">
        <label for="adminEmail">Email</label>
        <input
          id="adminEmail"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="admin-login-field">
        <label for="adminPassword">Password</label>
        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <div
        id="adminLoginMessage"
        class="admin-login-message"
        aria-live="polite"
      ></div>

      <div class="admin-login-actions">
        <button
          id="adminCancelBtn"
          type="button"
          class="secondary"
        >
          Cancel
        </button>

        <button
          id="adminSubmitBtn"
          type="submit"
          class="primary"
        >
          Sign In
        </button>
      </div>
    </form>
  </dialog>

  <main>

    <section class="search-panel">

      <div class="search-grid">

        <div class="field search-field">
          <label for="search">
            Search
          </label>

          <input
            id="search"
            type="text"
            placeholder="Search by name, topic, keyword, or facilitator"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="year">
            Academic Year
          </label>

          <select id="year">
            <option value="">
              All years
            </option>
          </select>
        </div>

        <div class="field">
          <label for="semester">
            Semester
          </label>

          <select id="semester">
            <option value="">
              All semesters
            </option>
          </select>
        </div>

        <div class="field">
          <label for="type">
            Event Type
          </label>

          <select id="type">
            <option value="">
              All event types
            </option>
          </select>
        </div>

        <div class="button-group">

          <button
            id="searchBtn"
            type="button"
            class="primary"
          >
            Search
          </button>

          <button
            id="clearBtn"
            type="button"
            class="secondary"
          >
            Clear
          </button>

        </div>

      </div>

      <div
        id="personChoices"
        class="person-choices"
        style="display: none;"
      ></div>

      <div
        id="personSummary"
        class="person-summary"
        style="display: none;"
      ></div>

      <div
        id="status"
        class="status"
      >
        Loading participation data...
      </div>

      <div class="search-note">
        Person searches accept First Last, Last, First, or Last.
      </div>

    </section>

    <section class="results">

      <div class="table-wrap">

        <table>

          <thead id="head">
            <tr>
              <th>Date</th>
              <th>Semester</th>
              <th>AY</th>
              <th>Topic</th>
              <th>Facilitator</th>
              <th>Participants</th>
              <th>Total</th>
            </tr>
          </thead>

          <tbody id="body">
          </tbody>

        </table>

      </div>

      <div
        id="empty"
        class="empty"
        style="display: none;"
      >
        No matching participation records found.
      </div>

    </section>

  </main>

<footer>
  Center for Teaching and Learning · Lackawanna College
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- =========================================================
     CTL RESULTS EXPORT TOOLS
     Print | Save as PDF | Save as CSV (Excel)
     ========================================================= -->

<style>

  /* ADMIN SIGN-IN */

  .admin-auth {
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }

  .admin-identity {
    font-size: 0.86rem;
    color: #555555;
  }

  .admin-link {
    height: 34px;
    padding: 0 12px;
    border: 1px solid #aeb7c1;
    border-radius: 5px;
    background: #ffffff;
    color: #263b52;

    font-weight: 700;
    cursor: pointer;
  }

  .admin-link:hover {
    background: #f2f4f6;
  }

  .admin-login-dialog {
    width: min(430px, calc(100% - 32px));
    border: 1px solid #c9cfd6;

    padding: 0;

  }

  .admin-login-dialog::backdrop {

  }

  .admin-login-dialog form {

  }

  .admin-login-heading {

    font-weight: 700;

  }

  .admin-login-field {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
  }

  .admin-login-field label {
    margin-bottom: 6px;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .admin-login-field input {
    width: 100%;
    height: 44px;

    border: 1px solid #b9c0c8;
    border-radius: 5px;
    font-size: 1rem;
  }

  .admin-login-message {
    min-height: 20px;

  }

  #reportingRange {
    display: none;
    margin-top: 14px;
    font-size: 0.95rem;
    color: #333333;
  }

  #reportingRange.visible {

  }

  #pdfHelp {
    display: none;
    margin-top: 10px;

  }

  #pdfHelp.visible {

  @media print {

    }

    main {

    }

    #exportTools,
    #pdfHelp,
    footer {
      display: none !important;
    }

    .search-panel {
      border: none !important;
      box-shadow: none !important;
      padding: 0 0 18px 0 !important;
      margin: 0 !important;
    }

    .status {
      display: none !important;
    }

    #reportingRange {
      display: block !important;
      margin: 8px 0 14px 0 !important;
      font-weight: 700 !important;

    }

    .person-summary {
      display: block !important;
      border: 1px solid #999 !important;
      border-left: 4px solid #333 !important;

      color: #000000 !important;
      margin: 15px 0 !important;
    }

    .results {
      border: none !important;
      box-shadow: none !important;
    }

    .table-wrap {
      overflow: visible !important;
    }

    table {
      width: 100% !important;
      border-collapse: collapse !important;
      font-size: 10pt !important;
    }

    thead {
      background: #ffffff !important;
      color: #000000 !important;
    }

    th {
      color: #000000 !important;
      background: #eeeeee !important;
      border: 1px solid #777 !important;
      padding: 7px !important;
    }

    td {
      color: #000000 !important;
      background: #ffffff !important;
      border: 1px solid #999 !important;
      padding: 7px !important;
    }

    tbody tr {
      background: #ffffff !important;
    }

    header {
      border-bottom: 2px solid #333 !important;
      margin-bottom: 18px !important;
    }

    header .inner {
      max-width: none !important;
      padding: 0 0 15px 0 !important;
    }

    header .logo {
      width: 300px !important;
      max-width: 300px !important;
      height: auto !important;
    }

    }
  }

  @media (max-width: 600px) {

    #exportTools button {

  }

</style>


<script>

(function () {

  const searchPanel =
    document.querySelector(".search-panel");

  const status =
    document.getElementById("status");

  const personSummary =
    document.getElementById("personSummary");

  const resultsBody =
    document.getElementById("body");

  const resultsHead =
    document.getElementById("head");


  /* Create export controls near the top */

  const reportingRange =
    document.createElement("div");

  reportingRange.id = "reportingRange";


  const exportTools =
    document.createElement("div");

  exportTools.id = "exportTools";


  exportTools.innerHTML = `
    <button id="exportPrintBtn" type="button">
      Print
    </button>

    <button id="exportPdfBtn" type="button">
      Save as PDF
    </button>

    <button id="exportCsvBtn" type="button">
      Save as CSV (Excel)
    </button>
  `;


  const pdfHelp =
    document.createElement("div");

  pdfHelp.id = "pdfHelp";

  pdfHelp.innerHTML =
    'In the print window, choose <strong>Save as PDF</strong> as the destination.';


  /*
    Place reporting range and export tools
    near the top of the search panel.
  */

  searchPanel.insertBefore(
    reportingRange,
    status
  );

  searchPanel.insertBefore(
    exportTools,
    status
  );

  searchPanel.insertBefore(
    pdfHelp,
    status
  );


  const printBtn =
    document.getElementById("exportPrintBtn");

  const pdfBtn =
    document.getElementById("exportPdfBtn");

  const csvBtn =
    document.getElementById("exportCsvBtn");


  function getDisplayedRows() {

    return Array.from(
      resultsBody.querySelectorAll("tr")
    );
  }


  function getAcademicYearsFromResults() {

    const years = new Set();

    const headerCells =
      Array.from(
        resultsHead.querySelectorAll("th")
      );

    const ayIndex =
      headerCells.findIndex(
        cell =>
          cell.textContent.trim() === "AY"
      );

    if (ayIndex === -1) {
      return [];
    }

    getDisplayedRows().forEach(row => {

      const cells =
        row.querySelectorAll("td");

      if (
        cells.length > ayIndex
      ) {

        const ay =
          cells[ayIndex]
            .textContent
            .trim();

        if (ay) {
          years.add(ay);
        }
      }
    });


    return Array.from(years).sort();
  }


  function updateReportingRange() {

    const years =
      getAcademicYearsFromResults();

    if (years.length === 0) {

      reportingRange.textContent = "";
      reportingRange.classList.remove(
        "visible"
      );

      return;
    }


    if (years.length === 1) {

      reportingRange.textContent =
        "Reporting Range: AY " +
        years[0];

    } else {

      reportingRange.textContent =
        "Reporting Range: AY " +
        years[0] +
        " to AY " +
        years[years.length - 1];
    }


    reportingRange.classList.add(
      "visible"
    );
  }


  function updateExportTools() {

    const hasResults =
      getDisplayedRows().length > 0;


    if (hasResults) {

      exportTools.classList.add(
        "visible"
      );

      updateReportingRange();

    } else {

      exportTools.classList.remove(
        "visible"
      );

      reportingRange.classList.remove(
        "visible"
      );

      pdfHelp.classList.remove(
        "visible"
      );
    }
  }


  if (resultsBody) {

    const observer =
      new MutationObserver(
        updateExportTools
      );

    observer.observe(
      resultsBody,
      {
        childList: true,
        subtree: true
      }
    );

    updateExportTools();
  }


  /* PRINT */

  printBtn.addEventListener(
    "click",
    function () {

      pdfHelp.classList.remove(
        "visible"
      );

      window.print();
    }
  );


  /* SAVE AS PDF */

  pdfBtn.addEventListener(
    "click",
    function () {

      pdfHelp.classList.add(
        "visible"
      );

      window.print();
    }
  );


  function csvEscape(value) {

    const text =
      String(
        value == null
          ? ""
          : value
      );

    return (
      '"' +
      text.replace(/"/g, '""') +
      '"'
    );
  }


  function getDisplayedTableData() {

    const rows = [];

    const headerCells =
      resultsHead.querySelectorAll("th");

    const headers =
      Array.from(
        headerCells
      ).map(
        cell =>
          cell.textContent.trim()
      );


    const years =
      getAcademicYearsFromResults();


    if (years.length === 1) {

      rows.push([
        "Reporting Range",
        "AY " + years[0]
      ]);

    } else if (years.length > 1) {

      rows.push([
        "Reporting Range",
        "AY " +
        years[0] +
        " to AY " +
        years[years.length - 1]
      ]);
    }


    if (
      personSummary &&
      personSummary.style.display !== "none" &&
      personSummary.textContent.trim()
    ) {

      rows.push([
        "Participation Summary",
        personSummary.textContent.trim()
      ]);
    }


    rows.push([]);

    rows.push(headers);


    getDisplayedRows().forEach(row => {

      const cells =
        row.querySelectorAll("td");

      const values =
        Array.from(
          cells
        ).map(
          cell =>
            cell.textContent.trim()
        );

      rows.push(values);
    });


    return rows;
  }


  function makeFilename() {

    const searchInput =
      document.getElementById("search");

    const yearSelect =
      document.getElementById("year");

    const semesterSelect =
      document.getElementById("semester");

    let name =
      "CTL_Participation";


    if (
      searchInput &&
      searchInput.value.trim()
    ) {

      name += "_" +
        searchInput.value
          .trim()
          .replace(
            /[^a-z0-9]+/gi,
            "_"
          )
          .replace(
            /^_+|_+$/g,
            ""
          );
    }


    if (
      yearSelect &&
      yearSelect.value
    ) {

      name += "_" +
        yearSelect.value
          .replace(
            /[^a-z0-9]+/gi,
            "_"
          );
    }


    if (
      semesterSelect &&
      semesterSelect.value
    ) {

      name += "_" +
        semesterSelect.value
          .replace(
            /[^a-z0-9]+/gi,
            "_"
          );
    }


    return name + ".csv";
  }


  /* SAVE AS CSV */

  csvBtn.addEventListener(
    "click",
    function () {

      const rows =
        getDisplayedTableData();

      if (rows.length <= 1) {
        return;
      }


      const csv =
        "\uFEFF" +
        rows
          .map(row =>
            row
              .map(csvEscape)
              .join(",")
          )
          .join("\r\n");


      const blob =
        new Blob(
          [csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        makeFilename();


      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }
  );

})();

</script>

</body>
